name: Enterprise Analytics Lakehouse Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-ci:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  docker-build-push:
    name: Build & Push Docker Images to ECR
    needs: terraform-ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build PySpark Docker Image
        run: |
          docker build -t eal-k8s-pyspark:latest -f docker/Dockerfile.pyspark .

      - name: Build dbt Docker Image
        run: |
          docker build -t eal-k8s-dbt:latest -f docker/Dockerfile.dbt .

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: env.AWS_ACCESS_KEY_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Images to ECR
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker tag eal-k8s-pyspark:latest $ECR_REGISTRY/eal-k8s-pyspark:$IMAGE_TAG
          docker tag eal-k8s-pyspark:latest $ECR_REGISTRY/eal-k8s-pyspark:latest
          docker push $ECR_REGISTRY/eal-k8s-pyspark:$IMAGE_TAG
          docker push $ECR_REGISTRY/eal-k8s-pyspark:latest

          docker tag eal-k8s-dbt:latest $ECR_REGISTRY/eal-k8s-dbt:$IMAGE_TAG
          docker tag eal-k8s-dbt:latest $ECR_REGISTRY/eal-k8s-dbt:latest
          docker push $ECR_REGISTRY/eal-k8s-dbt:$IMAGE_TAG
          docker push $ECR_REGISTRY/eal-k8s-dbt:latest

  k8s-deploy:
    name: Deploy Helm & Kubernetes Manifests to EKS
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifest YAML Syntax
        run: |
          python3 -c "import yaml; yaml.safe_load_all(open('k8s/spark-operator/spark-application.yaml'))"
          python3 -c "import yaml; yaml.safe_load_all(open('k8s/dbt/dbt-job.yaml'))"
          python3 -c "import yaml; yaml.safe_load_all(open('k8s/airflow/values.yaml'))"

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig & Deploy to EKS
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          aws eks update-kubeconfig --name eal-k8s-cluster --region us-east-1
          kubectl apply -f k8s/spark-operator/spark-application.yaml
          kubectl apply -f k8s/dbt/dbt-job.yaml
