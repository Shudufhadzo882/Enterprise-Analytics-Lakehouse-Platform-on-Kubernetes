name: Enterprise Analytics Lakehouse Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform-ci:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  docker-build-push:
    name: Build & Push Docker Images to ECR
    needs: terraform-ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push PySpark Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker build -t $ECR_REGISTRY/eal-k8s-pyspark:$IMAGE_TAG -f docker/Dockerfile.pyspark .
          docker tag $ECR_REGISTRY/eal-k8s-pyspark:$IMAGE_TAG $ECR_REGISTRY/eal-k8s-pyspark:latest
          docker push $ECR_REGISTRY/eal-k8s-pyspark:$IMAGE_TAG
          docker push $ECR_REGISTRY/eal-k8s-pyspark:latest

      - name: Build & Push dbt Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker build -t $ECR_REGISTRY/eal-k8s-dbt:$IMAGE_TAG -f docker/Dockerfile.dbt .
          docker tag $ECR_REGISTRY/eal-k8s-dbt:$IMAGE_TAG $ECR_REGISTRY/eal-k8s-dbt:latest
          docker push $ECR_REGISTRY/eal-k8s-dbt:$IMAGE_TAG
          docker push $ECR_REGISTRY/eal-k8s-dbt:latest

  k8s-deploy:
    name: Deploy Helm & Kubernetes Manifests to EKS
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name eal-k8s-cluster --region us-east-1

      - name: Deploy Spark & dbt Manifests
        run: |
          kubectl apply -f k8s/spark-operator/spark-application.yaml
          kubectl apply -f k8s/dbt/dbt-job.yaml
