apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-nyc-tlc-etl
  namespace: analytics
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "eal-k8s/pyspark-etl:latest"
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/work-dir/etl_bronze_silver.py"
  arguments:
    - "--input-path"
    - "s3a://nyc-tlc/trip-data/yellow_tripdata_2023-01.parquet"
    - "--bronze-output"
    - "s3a://eal-k8s-lakehouse-bronze-prod/nyc_trips/"
    - "--silver-output"
    - "s3a://eal-k8s-lakehouse-silver-prod/nyc_trips/"
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "2048m"
    labels:
      version: 3.5.0
    serviceAccount: spark-sa
  executor:
    cores: 2
    instances: 3
    memory: "4096m"
    labels:
      version: 3.5.0
